<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);background:#e7ebef;color:var(--color-ink-deep);-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  button{font-family:var(--font-body);}

  .demo-bar{width:1280px;margin:24px auto 14px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
    padding:12px 18px;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);}
  .demo-bar .lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--color-stone);text-transform:uppercase;}
  .demo-group{display:flex;align-items:center;gap:10px;}
  .demo-group > span{font-size:13px;color:var(--color-charcoal);font-weight:700;}
  .demo-pills{display:flex;gap:8px;}
  .demo-pills button{white-space:nowrap;}
  .demo-bar .hint{margin-left:auto;font-size:12px;color:var(--color-stone);}

  .app{width:1280px;margin:0 auto 44px;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);
    border-radius:var(--radius-xxl);overflow:hidden;display:grid;grid-template-columns:240px 1fr;min-height:900px;
    box-shadow:0 18px 50px rgba(10,19,23,.10);position:relative;}
  .app svg{width:18px;height:18px;flex:none;stroke:currentColor;}

  .nav{border-right:1px solid var(--color-hairline-soft);padding:22px 16px;display:flex;flex-direction:column;background:var(--color-canvas);}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 24px;}
  .brand .mark{width:34px;height:34px;border-radius:var(--radius-full);flex:none;
    background:radial-gradient(circle at 30% 30%,#0091ff,#0064e0 55%,#0457cb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
  .brand b{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--color-ink-deep);line-height:1.1;}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--color-stone);}
  .nav-sec{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--color-stone);text-transform:uppercase;padding:12px 12px 8px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:3px 0;border-radius:var(--radius-full);
    color:var(--color-charcoal);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:-.14px;cursor:pointer;
    border:1px solid transparent;transition:background-color 150ms ease-out,color 150ms ease-out;}
  .nav-item svg{width:19px;height:19px;}
  .nav-item:hover{background:var(--color-surface-soft);}
  .nav-item.active{background:var(--color-ink-deep);color:var(--color-canvas);border-color:var(--color-ink-deep);}
  .nav-item .nbadge{margin-left:auto;background:var(--color-critical);color:#fff;font-size:11px;font-weight:700;
    min-width:19px;height:19px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .nav-item.active .nbadge{background:var(--color-canvas);color:var(--color-ink-deep);}
  .nav-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--color-hairline-soft);display:flex;align-items:center;gap:11px;}
  .nav-foot .ava{width:34px;height:34px;border-radius:var(--radius-full);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--color-ink);flex:none;}
  .nav-foot .who b{font-size:13px;font-weight:700;display:block;color:var(--color-ink-deep);}
  .nav-foot .who span{font-size:11.5px;color:var(--color-stone);}

  .main-col{display:flex;flex-direction:column;min-width:0;background:var(--color-surface-soft);}
  .topbar{height:64px;background:var(--color-canvas);border-bottom:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;gap:16px;padding:0 28px;flex:none;}
  .search{display:flex;align-items:center;gap:10px;width:340px;height:42px;padding:0 16px;
    background:var(--color-surface-soft);border:1px solid transparent;border-radius:var(--radius-full);color:var(--color-stone);}
  .search:focus-within{border-color:var(--color-fb-blue);background:var(--color-canvas);}
  .search svg{width:17px;height:17px;stroke:var(--color-steel);}
  .search input{border:0;background:transparent;outline:none;font-family:var(--font-body);font-size:14px;letter-spacing:-.14px;color:var(--color-ink);width:100%;}
  .search input::placeholder{color:var(--color-stone);}
  .topbar .spacer{flex:1;}
  .ib-wrap{position:relative;}
  .ib-wrap .dot{position:absolute;top:-3px;right:-3px;background:var(--color-critical);color:#fff;font-size:10.5px;font-weight:700;
    min-width:18px;height:18px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;border:2px solid var(--color-canvas);padding:0 3px;}
  .prof{display:flex;align-items:center;gap:10px;cursor:pointer;padding-left:4px;}
  .prof .ava{width:36px;height:36px;border-radius:var(--radius-full);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--color-ink);}
  .prof .pn b{font-size:13.5px;font-weight:700;display:block;line-height:1.2;color:var(--color-ink-deep);}
  .prof .pn span{font-size:11.5px;color:var(--color-stone);}

  .content{padding:24px 28px 40px;overflow:auto;flex:1;}

  /* control bar */
  .ctrl-top{display:flex;align-items:center;gap:13px;margin-bottom:18px;}
  .ctrl-top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;font-feature-settings:"ss01" 1,"ss02" 1;color:var(--color-ink-deep);}
  .ctrl-top .ucount{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:var(--radius-full);
    background:var(--color-critical);color:#fff;font-size:13px;font-weight:700;letter-spacing:-.14px;}
  .ctrl-top .spacer{flex:1;}
  .ctrl-filters{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .tabs{display:flex;gap:8px;}
  .tabs button{white-space:nowrap;}
  .ctrl-filters .spacer{flex:1;}
  .fdrop{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--radius-full);
    border:1px solid var(--color-hairline);background:var(--color-canvas);color:var(--color-ink-deep);
    font-size:13px;font-weight:600;letter-spacing:-.14px;cursor:pointer;transition:border-color 150ms;}
  .fdrop:hover{border-color:var(--color-stone);}
  .fdrop .ph{color:var(--color-stone);}
  .fdrop svg{width:15px;height:15px;stroke:var(--color-steel);}

  /* inbox panel */
  .inbox{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);overflow:hidden;}
  .grp-head{padding:14px 22px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--color-stone);
    text-transform:uppercase;background:var(--color-surface-soft);border-bottom:1px solid var(--color-hairline-soft);}
  .grp-head .gc{color:var(--color-stone);font-weight:600;margin-left:6px;letter-spacing:0;}

  .notif{display:flex;align-items:center;gap:15px;padding:16px 22px;border-bottom:1px solid var(--color-hairline-soft);
    cursor:pointer;transition:background-color 150ms ease-out;position:relative;}
  .notif:hover{background:var(--color-surface-soft);}
  .notif.read{opacity:.6;}
  .notif.urgent::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--color-critical);}

  .n-icon{width:40px;height:40px;border-radius:var(--radius-full);flex:none;display:flex;align-items:center;justify-content:center;}
  .n-icon svg{width:19px;height:19px;}
  .ic-expiry{background:#fdeed6;}.ic-expiry svg{stroke:#c77e00;}
  .ic-deadline{background:#e2eefc;}.ic-deadline svg{stroke:var(--color-primary);}
  .ic-match{background:#efe8fa;}.ic-match svg{stroke:#6f3fc0;}
  .ic-urgent{background:#fbe1e5;}.ic-urgent svg{stroke:var(--color-critical);}

  .n-body{flex:1;min-width:0;}
  .n-titlerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .n-title{font-size:14.5px;font-weight:700;color:var(--color-ink-deep);letter-spacing:-.16px;}
  .notif.read .n-title{font-weight:600;color:var(--color-charcoal);}
  .tpill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:700;letter-spacing:-.14px;
    border:1px solid var(--color-hairline);color:var(--color-charcoal);background:var(--color-canvas);}
  .urg-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:var(--radius-full);font-size:11px;font-weight:700;
    background:var(--color-critical);color:#fff;letter-spacing:-.14px;}
  .ddi{font-weight:800;}
  .ddi.red{color:var(--color-critical);}.ddi.amber{color:#b9760a;}.ddi.gray{color:var(--color-steel);}
  .n-sub{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--color-steel);margin-top:5px;letter-spacing:-.14px;}
  .n-sub svg{width:14px;height:14px;stroke:var(--color-stone);}

  .n-right{display:flex;align-items:center;gap:14px;flex:none;}
  .n-time{font-size:12.5px;color:var(--color-stone);font-weight:600;white-space:nowrap;}
  .n-udot{width:9px;height:9px;border-radius:50%;background:var(--color-primary);flex:none;}
  .n-udot.placeholder{background:transparent;}
  .n-actions{display:none;align-items:center;gap:8px;}
  .notif:hover .n-actions{display:flex;}
  .notif:hover .n-time,.notif:hover .n-udot{display:none;}
  .abtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-full);
    border:1px solid var(--color-hairline);background:var(--color-canvas);color:var(--color-ink-deep);
    font-size:12.5px;font-weight:700;letter-spacing:-.14px;cursor:pointer;transition:background-color 150ms,border-color 150ms;white-space:nowrap;}
  .abtn:hover{background:var(--color-surface-soft);border-color:var(--color-stone);}
  .abtn.go{background:var(--color-ink-deep);color:var(--color-canvas);border-color:var(--color-ink-deep);}
  .abtn.go:hover{background:var(--color-charcoal);}
  .abtn svg{width:14px;height:14px;}

  /* empty / no-result */
  .empty{padding:96px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .empty .eico{width:76px;height:76px;border-radius:var(--radius-xl);background:var(--color-surface-soft);display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
  .empty .eico svg{width:36px;height:36px;stroke:var(--color-stone);}
  .empty h2{margin:0 0 10px;font-size:23px;font-weight:600;letter-spacing:-.01em;font-feature-settings:"ss01" 1,"ss02" 1;color:var(--color-ink-deep);white-space:nowrap;}
  .empty p{margin:0;font-size:14.5px;color:var(--color-steel);max-width:380px;line-height:1.5;letter-spacing:-.16px;}
</style>

    { label:'설정', icon:I.gear },
  ];
  return (
    <nav className="nav">
      <div className="brand"><div className="mark">관</div><div><b>관제</b><small>Compliance Desk</small></div></div>
      <div className="nav-sec">메뉴</div>
      {items.map((it,i) => (
        <div key={i} className={'nav-item' + (it.active ? ' active' : '')}>
          {it.icon}<span>{it.label}</span>{it.badge ? <span className="nbadge">{it.badge}</span> : null}
        </div>
      ))}
      <div className="nav-foot"><div className="ava">김</div><div className="who"><b>김컨설턴트</b><span>Growth Partners</span></div></div>
    </nav>
  );
}

function TopBar({ unread }) {
  return (
    <header className="topbar">
      <div className="search">{I.search}<input placeholder="기업·자격·과제 검색" /></div>
      <div className="spacer"></div>
      <div className="ib-wrap"><IconButton label="알림">{I.bell}</IconButton>{unread ? <span className="dot">{unread}</span> : null}</div>
      <div className="prof"><div className="ava">김</div><div className="pn"><b>김컨설턴트</b><span>경영컨설턴트</span></div></div>
    </header>
  );
}

function NotifRow({ n, onRead, onGo }) {
  const t = TYPE[n.type];
  const iconCls = n.urgent ? 'ic-urgent' : t.ic;
  return (
    <div className={'notif' + (n.read ? ' read' : '') + (n.urgent ? ' urgent' : '')} onClick={() => onGo(n.id)}>
      <div className={'n-icon ' + iconCls}>{t.icon}</div>
      <div className="n-body">
        <div className="n-titlerow">
          <span className="tpill">{t.label}</span>
          {n.urgent ? <span className="urg-badge">긴급</span> : null}
          <span className="n-title">{n.title}</span>
          {n.dday ? <span className={'ddi num ' + n.ddCls}>{n.dday}</span> : null}
        </div>
        <div className="n-sub">{I.building}{n.co}</div>
      </div>
      <div className="n-right">
        <span className="n-time num">{n.time}</span>
        <span className={'n-udot' + (n.read ? ' placeholder' : '')}></span>
        <div className="n-actions">
          {!n.read && <button className="abtn" onClick={(e) => { e.stopPropagation(); onRead(n.id); }}>{I.check} 읽음 처리</button>}
          <button className="abtn go" onClick={(e) => { e.stopPropagation(); onGo(n.id); }}>{I.arrow} 기업으로 이동</button>
        </div>
      </div>
    </div>
  );
}

function DemoBar({ state, setState }) {
  return (
    <div className="demo-bar">
      <span className="lab">탐색</span>
      <div className="demo-group">
        <span>알림 상태</span>
        <div className="demo-pills">
          <PillTab active={state==='normal'} onClick={() => setState('normal')}>정상</PillTab>
          <PillTab active={state==='empty'} onClick={() => setState('empty')}>빈 상태</PillTab>
        </div>
      </div>
      <span className="hint">유형 탭으로 필터 · 항목 클릭 시 읽음 처리 · Meta Design System</span>
    </div>
  );
}

function App() {
  const [state, setState] = useState('normal');
  const [items, setItems] = useState(SEED);
  const [filter, setFilter] = useState('all');

  const unread = items.filter(i => !i.read).length;
  const markRead = (id) => setItems(its => its.map(i => i.id===id ? { ...i, read:true } : i));
  const markAll = () => setItems(its => its.map(i => ({ ...i, read:true })));

  const list = state === 'empty' ? [] : items.filter(i => filter==='all' || i.type===filter);
  const isEmpty = list.length === 0;

  return (
    <>
      <DemoBar state={state} setState={setState} />
      <div className="app">
        <Nav unread={unread} />
        <div className="main-col">
          <TopBar unread={unread} />
          <div className="content">
            <div className="ctrl-top">
              <h1>알림</h1>
              {unread > 0 && <span className="ucount num">안읽음 {unread}</span>}
              <div className="spacer"></div>
              <Button variant="secondary" disabled={unread===0} onClick={markAll} style={{ padding:'10px 20px' }}>{I.checks} 모두 읽음 처리</Button>
            </div>
            <div className="ctrl-filters">
              <div className="tabs">
                {FILTERS.map(([k,label]) => (
                  <PillTab key={k} active={filter===k} onClick={() => setFilter(k)}>{label}</PillTab>
                ))}
              </div>
              <div className="spacer"></div>
              <button className="fdrop"><span className="ph">기업 전체</span>{I.chevron}</button>
            </div>

            <div className="inbox">
              {state === 'empty' ? (
                <div className="empty">
                  <div className="eico">{I.bell}</div>
                  <h2>새 알림이 없습니다</h2>
                  <p>만료·마감·공고매칭 알림이 도착하면 여기에서 모아 확인할 수 있습니다.</p>
                </div>
              ) : isEmpty ? (
                <div className="empty">
                  <div className="eico">{I.belloff}</div>
                  <h2>해당 유형의 알림이 없습니다</h2>
                  <p>다른 유형 탭을 선택하거나 필터를 초기화해 보세요.</p>
                </div>
              ) : (
                GROUPS.map(([gk,glabel]) => {
                  const rows = list.filter(i => i.grp === gk);
                  if (!rows.length) return null;
                  const gUnread = rows.filter(r => !r.read).length;
                  return (
                    <div key={gk}>
                      <div className="grp-head">{glabel}{gUnread ? <span className="gc">· 안읽음 {gUnread}</span> : null}</div>
                      {rows.map(n => <NotifRow key={n.id} n={n} onRead={markRead} onGo={markRead} />)}
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
