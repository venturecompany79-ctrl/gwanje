<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일괄안내 (캠페인) · Meta DS</title>

<link rel="stylesheet" href="_ds/meta-design-system-d06bccfc-faa7-4ee6-9fec-89516d6f6b24/tokens/fonts.css">
<link rel="stylesheet" href="_ds/meta-design-system-d06bccfc-faa7-4ee6-9fec-89516d6f6b24/tokens/colors.css">
<link rel="stylesheet" href="_ds/meta-design-system-d06bccfc-faa7-4ee6-9fec-89516d6f6b24/tokens/typography.css">
<link rel="stylesheet" href="_ds/meta-design-system-d06bccfc-faa7-4ee6-9fec-89516d6f6b24/tokens/layout.css">
<link rel="stylesheet" href="_ds/meta-design-system-d06bccfc-faa7-4ee6-9fec-89516d6f6b24/styles.css">

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);background:#e7ebef;color:var(--color-ink-deep);-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  button{font-family:var(--font-body);}

  .demo-bar{width:1280px;margin:24px auto 14px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
    padding:12px 18px;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);}
  .demo-bar .lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--color-stone);text-transform:uppercase;}
  .demo-group{display:flex;align-items:center;gap:10px;}
  .demo-group > span{font-size:13px;color:var(--color-charcoal);font-weight:700;}
  .demo-pills{display:flex;gap:8px;}
  .demo-pills button{white-space:nowrap;}
  .demo-bar .hint{margin-left:auto;font-size:12px;color:var(--color-stone);}

  .app{width:1280px;margin:0 auto 44px;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);
    border-radius:var(--radius-xxl);overflow:hidden;display:grid;grid-template-columns:240px 1fr;min-height:900px;
    box-shadow:0 18px 50px rgba(10,19,23,.10);position:relative;}
  .app svg{width:18px;height:18px;flex:none;stroke:currentColor;}

  .nav{border-right:1px solid var(--color-hairline-soft);padding:22px 16px;display:flex;flex-direction:column;background:var(--color-canvas);}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 24px;}
  .brand .mark{width:34px;height:34px;border-radius:var(--radius-full);flex:none;
    background:radial-gradient(circle at 30% 30%,#0091ff,#0064e0 55%,#0457cb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
  .brand b{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--color-ink-deep);line-height:1.1;}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--color-stone);}
  .nav-sec{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--color-stone);text-transform:uppercase;padding:12px 12px 8px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:3px 0;border-radius:var(--radius-full);
    color:var(--color-charcoal);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:-.14px;cursor:pointer;
    border:1px solid transparent;transition:background-color 150ms ease-out,color 150ms ease-out;}
  .nav-item svg{width:19px;height:19px;}
  .nav-item:hover{background:var(--color-surface-soft);}
  .nav-item.active{background:var(--color-ink-deep);color:var(--color-canvas);border-color:var(--color-ink-deep);}
  .nav-item .nbadge{margin-left:auto;background:var(--color-critical);color:#fff;font-size:11px;font-weight:700;
    min-width:19px;height:19px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .nav-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--color-hairline-soft);display:flex;align-items:center;gap:11px;}
  .nav-foot .ava{width:34px;height:34px;border-radius:var(--radius-full);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--color-ink);flex:none;}
  .nav-foot .who b{font-size:13px;font-weight:700;display:block;color:var(--color-ink-deep);}
  .nav-foot .who span{font-size:11.5px;color:var(--color-stone);}

  .main-col{display:flex;flex-direction:column;min-width:0;background:var(--color-surface-soft);}
  .topbar{height:64px;background:var(--color-canvas);border-bottom:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;gap:16px;padding:0 28px;flex:none;}
  .search{display:flex;align-items:center;gap:10px;width:340px;height:42px;padding:0 16px;
    background:var(--color-surface-soft);border:1px solid transparent;border-radius:var(--radius-full);color:var(--color-stone);}
  .search:focus-within{border-color:var(--color-fb-blue);background:var(--color-canvas);}
  .search svg{width:17px;height:17px;stroke:var(--color-steel);}
  .search input{border:0;background:transparent;outline:none;font-family:var(--font-body);font-size:14px;letter-spacing:-.14px;color:var(--color-ink);width:100%;}
  .search input::placeholder{color:var(--color-stone);}
  .topbar .spacer{flex:1;}
  .ib-wrap{position:relative;}
  .ib-wrap .dot{position:absolute;top:-3px;right:-3px;background:var(--color-critical);color:#fff;font-size:10.5px;font-weight:700;
    min-width:18px;height:18px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;border:2px solid var(--color-canvas);padding:0 3px;}
  .prof{display:flex;align-items:center;gap:10px;cursor:pointer;padding-left:4px;}
  .prof .ava{width:36px;height:36px;border-radius:var(--radius-full);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--color-ink);}
  .prof .pn b{font-size:13.5px;font-weight:700;display:block;line-height:1.2;color:var(--color-ink-deep);}
  .prof .pn span{font-size:11.5px;color:var(--color-stone);}

  .content{padding:26px 28px 44px;overflow:auto;flex:1;}
  .page-head{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .page-head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;font-feature-settings:"ss01" 1,"ss02" 1;color:var(--color-ink-deep);}
  .page-head .crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--color-steel);font-weight:600;cursor:pointer;}
  .page-head .crumb svg{width:15px;height:15px;}
  .page-head .crumb:hover{color:var(--color-primary-deep);}
  .page-head .spacer{flex:1;}

  .panel{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);overflow:hidden;}
  .sec-head{display:flex;align-items:center;gap:13px;padding:18px 22px;border-bottom:1px solid var(--color-hairline-soft);}
  .sec-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.16px;color:var(--color-ink-deep);}
  .sec-head .cnt{font-size:13px;color:var(--color-stone);font-weight:600;}
  .sec-head .spacer{flex:1;}

  /* status badge */
  .stbadge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--radius-full);font-size:12px;font-weight:700;letter-spacing:-.14px;}
  .stbadge .sd{width:7px;height:7px;border-radius:50%;}
  .st-sent{background:#e2f0e6;color:#147a49;}.st-sent .sd{background:var(--color-success);}
  .st-sched{background:#e2eefc;color:var(--color-primary-deep);}.st-sched .sd{background:var(--color-primary);}
  .st-draft{background:var(--color-surface-soft);color:var(--color-steel);}.st-draft .sd{background:var(--color-stone);}
  .seg-chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-full);border:1px solid var(--color-hairline);
    background:var(--color-canvas);font-size:12px;font-weight:600;color:var(--color-charcoal);letter-spacing:-.14px;white-space:nowrap;}

  /* table */
  table.dlist{width:100%;border-collapse:collapse;}
  table.dlist th{text-align:left;font-size:12px;font-weight:700;color:var(--color-stone);text-transform:uppercase;
    padding:13px 22px;border-bottom:1px solid var(--color-hairline-soft);}
  table.dlist th.r,table.dlist td.r{text-align:right;}
  table.dlist th.c,table.dlist td.c{text-align:center;}
  table.dlist td{padding:15px 22px;border-bottom:1px solid var(--color-hairline-soft);font-size:14px;vertical-align:middle;letter-spacing:-.14px;}
  table.dlist tbody tr:last-child td{border-bottom:0;}
  table.dlist tbody tr.clk{cursor:pointer;transition:background-color 150ms ease-out;}
  table.dlist tbody tr.clk:hover{background:var(--color-surface-soft);}
  table.dlist .ttl{font-weight:700;color:var(--color-ink-deep);}
  table.dlist .muted{color:var(--color-stone);}
  .rate{font-weight:700;color:var(--color-ink-deep);}

  /* empty */
  .empty{padding:88px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .empty .eico{width:76px;height:76px;border-radius:var(--radius-xl);background:var(--color-surface-soft);display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
  .empty .eico svg{width:36px;height:36px;stroke:var(--color-stone);}
  .empty h2{margin:0 0 10px;font-size:23px;font-weight:600;letter-spacing:-.01em;font-feature-settings:"ss01" 1,"ss02" 1;color:var(--color-ink-deep);white-space:nowrap;}
  .empty p{margin:0 0 26px;font-size:14.5px;color:var(--color-steel);max-width:380px;line-height:1.5;letter-spacing:-.16px;}

  /* step indicator */
  .steps{display:flex;align-items:center;justify-content:center;gap:0;padding:22px;background:var(--color-canvas);
    border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);margin-bottom:20px;}
  .step{display:flex;align-items:center;gap:11px;cursor:pointer;}
  .step .circ{width:30px;height:30px;border-radius:50%;border:2px solid var(--color-hairline);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--color-stone);flex:none;background:var(--color-canvas);transition:all 150ms;}
  .step .circ svg{width:15px;height:15px;stroke:#fff;}
  .step.active .circ{background:var(--color-ink-deep);border-color:var(--color-ink-deep);color:#fff;}
  .step.done .circ{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
  .step .slab{font-size:14px;font-weight:700;color:var(--color-stone);letter-spacing:-.14px;}
  .step.active .slab,.step.done .slab{color:var(--color-ink-deep);}
  .step-conn{width:64px;height:2px;background:var(--color-hairline);margin:0 16px;}
  .step-conn.done{background:var(--color-primary);}

  /* wizard 2-pane */
  .wz-grid{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start;}
  .panel-body{padding:22px;}
  .andor{display:inline-flex;background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-full);padding:3px;margin:4px 0 4px 8px;}
  .andor button{border:0;background:transparent;font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--color-steel);
    padding:5px 12px;border-radius:var(--radius-full);cursor:pointer;}
  .andor button.on{background:var(--color-ink-deep);color:#fff;}
  .cond-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .cinput{height:42px;border:1px solid var(--color-hairline);border-radius:var(--radius-lg);background:var(--color-canvas);
    font-family:var(--font-body);font-size:14px;color:var(--color-ink-deep);padding:0 12px;letter-spacing:-.14px;}
  select.cinput{cursor:pointer;min-width:130px;}
  input.cinput{width:120px;}
  .cond-row .op{min-width:88px;}
  .cond-row .x{width:38px;height:38px;border-radius:var(--radius-full);border:1px solid var(--color-hairline-soft);background:var(--color-canvas);
    cursor:pointer;color:var(--color-stone);display:flex;align-items:center;justify-content:center;flex:none;}
  .cond-row .x:hover{background:#fbe1e5;color:var(--color-critical);border-color:#f3c4cb;}
  .cond-row .x svg{width:15px;height:15px;}

  /* preview list */
  .prev-head{display:flex;align-items:center;gap:9px;padding:16px 18px;border-bottom:1px solid var(--color-hairline-soft);background:var(--color-surface-soft);}
  .prev-head .cu{font-size:18px;font-weight:700;letter-spacing:-.16px;color:var(--color-ink-deep);}
  .prev-head .cl{font-size:13px;color:var(--color-steel);font-weight:600;}
  .prev-list{padding:8px;max-height:380px;overflow:auto;}
  .prev-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:var(--radius-lg);font-size:14px;font-weight:600;color:var(--color-ink-deep);letter-spacing:-.14px;}
  .prev-item:hover{background:var(--color-surface-soft);}
  .prev-item svg{width:16px;height:16px;stroke:var(--color-stone);}
  .seg-zero{padding:48px 24px;text-align:center;}
  .seg-zero .zico{width:60px;height:60px;border-radius:var(--radius-xl);background:#fdeed6;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .seg-zero .zico svg{width:28px;height:28px;stroke:var(--color-attention);}
  .seg-zero h3{margin:0 0 7px;font-size:16px;font-weight:700;color:var(--color-ink-deep);letter-spacing:-.16px;}
  .seg-zero p{margin:0;font-size:13px;color:var(--color-steel);letter-spacing:-.14px;}

  /* message step */
  .field-label{font-size:13px;font-weight:700;color:var(--color-ink);letter-spacing:-.14px;margin-bottom:8px;}
  .selbox{display:flex;align-items:center;justify-content:space-between;gap:10px;height:44px;padding:0 14px;border-radius:var(--radius-lg);
    border:1px solid var(--color-hairline);background:var(--color-canvas);font-size:14px;font-weight:600;color:var(--color-ink-deep);letter-spacing:-.14px;cursor:pointer;}
  .selbox svg{width:16px;height:16px;stroke:var(--color-steel);}
  .var-chips{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;}
  .vchip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:var(--radius-full);border:1px dashed var(--color-hairline);
    background:var(--color-surface-soft);font-size:12.5px;font-weight:700;color:var(--color-primary-deep);cursor:pointer;letter-spacing:-.14px;}
  .vchip:hover{border-color:var(--color-primary);}
  .msg-area{width:100%;min-height:180px;border:1px solid var(--color-hairline);border-radius:var(--radius-lg);padding:14px;
    font-family:var(--font-body);font-size:14px;line-height:1.6;color:var(--color-ink);resize:vertical;letter-spacing:-.14px;}
  .msg-area:focus{outline:none;border:2px solid var(--color-fb-blue);}
  /* talk preview */
  .phone{background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);padding:18px;height:100%;}
  .phone-top{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--color-steel);margin-bottom:14px;letter-spacing:-.14px;}
  .phone-top .kk{width:22px;height:22px;border-radius:7px;background:var(--color-warning);display:flex;align-items:center;justify-content:center;color:var(--color-ink-deep);font-size:11px;font-weight:800;}
  .bubble{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:4px 16px 16px 16px;padding:16px;font-size:13.5px;line-height:1.62;color:var(--color-ink-deep);letter-spacing:-.14px;}
  .bubble .bt{font-weight:700;margin-bottom:8px;}
  .bubble .vv{color:var(--color-primary-deep);font-weight:700;}
  .bubble .btn-ghost{margin-top:12px;text-align:center;border:1px solid var(--color-hairline);border-radius:var(--radius-md);padding:9px;font-size:13px;font-weight:700;color:var(--color-ink-deep);}

  /* confirm step */
  .sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px;}
  .sum-card{border:1px solid var(--color-hairline-soft);border-radius:var(--radius-lg);padding:16px 18px;}
  .sum-card .sk{font-size:12.5px;color:var(--color-steel);font-weight:600;letter-spacing:-.14px;}
  .sum-card .sv{font-size:20px;font-weight:700;color:var(--color-ink-deep);margin-top:6px;letter-spacing:-.16px;}
  .radio-row{display:flex;gap:12px;margin-top:6px;}
  .ropt{flex:1;display:flex;align-items:center;gap:11px;padding:14px 16px;border:1px solid var(--color-hairline-soft);border-radius:var(--radius-lg);cursor:pointer;transition:all 150ms;}
  .ropt.on{border:2px solid var(--color-radio-selected);padding:13px 15px;}
  .ropt .ring{width:18px;height:18px;border-radius:50%;border:2px solid var(--color-hairline);flex:none;display:flex;align-items:center;justify-content:center;}
  .ropt.on .ring{border-color:var(--color-radio-selected);}
  .ropt.on .ring::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--color-radio-selected);}
  .ropt .rt{font-size:14px;font-weight:700;color:var(--color-ink-deep);letter-spacing:-.14px;}
  .ropt .rs{font-size:12px;color:var(--color-stone);margin-top:2px;}
  .wz-foot{display:flex;align-items:center;gap:10px;padding:18px 22px;border-top:1px solid var(--color-hairline-soft);}
  .wz-foot .spacer{flex:1;}

  /* results KPI */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .kpi{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);padding:18px 20px;}
  .kpi .klab{font-size:13px;color:var(--color-steel);font-weight:600;letter-spacing:-.14px;}
  .kpi .kval{font-size:36px;font-weight:700;color:var(--color-ink-deep);margin-top:10px;line-height:1;letter-spacing:-.02em;}
  .kpi.hl .kval{color:var(--color-primary);}
  .ans{font-size:13.5px;color:var(--color-ink-deep);letter-spacing:-.14px;}
  .ans.no{color:var(--color-stone);}
  .yn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:-.14px;}
  .yn.ok{color:#147a49;}.yn.no{color:var(--color-stone);}
  .yn .d{width:7px;height:7px;border-radius:50%;}.yn.ok .d{background:var(--color-success);}.yn.no .d{background:var(--color-stone);}

  /* toast */
  .toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);opacity:0;z-index:40;
    display:flex;align-items:center;gap:10px;background:var(--color-ink-deep);color:#fff;padding:13px 20px;border-radius:var(--radius-full);
    font-size:14px;font-weight:700;letter-spacing:-.14px;box-shadow:0 8px 24px rgba(10,19,23,.28);transition:transform 260ms ease-out,opacity 260ms ease-out;pointer-events:none;}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast .tcheck{width:22px;height:22px;border-radius:50%;background:var(--color-success);display:flex;align-items:center;justify-content:center;}
  .toast .tcheck svg{width:13px;height:13px;stroke:#fff;}
  .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  const doSend = () => {
    showToast('sending');
    setTimeout(() => { setView('results'); showToast('done', 2600); }, 1300);
  };

  return (
    <>
      <div className="demo-bar">
        <span className="lab">탐색</span>
        <div className="demo-group">
          <span>컷</span>
          <div className="demo-pills">
            <PillTab active={view==='list' && !listEmpty} onClick={() => { setView('list'); setListEmpty(false); }}>A 목록</PillTab>
            <PillTab active={view==='list' && listEmpty} onClick={() => { setView('list'); setListEmpty(true); }}>A 목록·빈</PillTab>
            <PillTab active={view==='wizard'} onClick={() => { setView('wizard'); }}>B 작성</PillTab>
            <PillTab active={view==='results'} onClick={() => setView('results')}>C 집계</PillTab>
          </div>
        </div>
        {view==='wizard' && (
          <div className="demo-group">
            <span>스텝</span>
            <div className="demo-pills">
              <PillTab active={step===1} onClick={() => setStep(1)}>①</PillTab>
              <PillTab active={step===2} onClick={() => setStep(2)}>②</PillTab>
              <PillTab active={step===3} onClick={() => setStep(3)}>③</PillTab>
              <PillTab active={zero} onClick={() => { setStep(1); setZero(z => !z); }}>세그먼트 0건</PillTab>
            </div>
          </div>
        )}
        <span className="hint">목록 → 3스텝 작성 → 응답 집계 · Meta Design System</span>
      </div>
      <div className="app">
        <Nav />
        <div className="main-col">
          <TopBar />
          <div className="content">
            {view==='list' && <ListCut empty={listEmpty} onNew={startNew} onOpen={() => setView('results')} />}
            {view==='wizard' && <Wizard step={step} setStep={setStep} zero={zero} onCancel={() => setView('list')} onSend={doSend} />}
            {view==='results' && <ResultsCut onBack={() => setView('list')} />}
          </div>
        </div>
        <div className={'toast' + (toast ? ' show' : '')}>
          {toast==='sending' ? <><span className="spin"></span>발송 중…</> : <><span className="tcheck">{I.check}</span>5개사에 발송되었습니다</>}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
