<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);background:#e7ebef;color:var(--color-ink-deep);-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  button{font-family:var(--font-body);}

  .demo-bar{width:1280px;margin:24px auto 14px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
    padding:12px 18px;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);}
  .demo-bar .lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--color-stone);text-transform:uppercase;}
  .demo-group{display:flex;align-items:center;gap:10px;}
  .demo-group > span{font-size:13px;color:var(--color-charcoal);font-weight:700;}
  .demo-pills{display:flex;gap:8px;}
  .demo-pills button{white-space:nowrap;}
  .demo-bar .hint{margin-left:auto;font-size:12px;color:var(--color-stone);}

  .app{width:1280px;margin:0 auto 44px;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);
    border-radius:var(--radius-xxl);overflow:hidden;display:grid;grid-template-columns:240px 1fr;min-height:900px;
    box-shadow:0 18px 50px rgba(10,19,23,.10);position:relative;}
  .app svg{width:18px;height:18px;flex:none;stroke:currentColor;}

  /* nav */
  .nav{border-right:1px solid var(--color-hairline-soft);padding:22px 16px;display:flex;flex-direction:column;background:var(--color-canvas);}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 24px;}
  .brand .mark{width:34px;height:34px;border-radius:var(--radius-full);flex:none;
    background:radial-gradient(circle at 30% 30%,#0091ff,#0064e0 55%,#0457cb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
  .brand b{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--color-ink-deep);line-height:1.1;}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--color-stone);}
  .nav-sec{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--color-stone);text-transform:uppercase;padding:12px 12px 8px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:3px 0;border-radius:var(--radius-full);
    color:var(--color-charcoal);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:-.14px;cursor:pointer;
    border:1px solid transparent;transition:background-color 150ms ease-out,color 150ms ease-out;}
  .nav-item svg{width:19px;height:19px;}
  .nav-item:hover{background:var(--color-surface-soft);}
  .nav-item.active{background:var(--color-ink-deep);color:var(--color-canvas);border-color:var(--color-ink-deep);}
  .nav-item .nbadge{margin-left:auto;background:var(--color-critical);color:#fff;font-size:11px;font-weight:700;
    min-width:19px;height:19px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .nav-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--color-hairline-soft);display:flex;align-items:center;gap:11px;}
  .nav-foot .ava{width:34px;height:34px;border-radius:var(--radius-full);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--color-ink);flex:none;}
  .nav-foot .who b{font-size:13px;font-weight:700;display:block;color:var(--color-ink-deep);}
  .nav-foot .who span{font-size:11.5px;color:var(--color-stone);}

  /* main */
  .main-col{display:flex;flex-direction:column;min-width:0;background:var(--color-surface-soft);}
  .topbar{height:64px;background:var(--color-canvas);border-bottom:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;gap:16px;padding:0 28px;flex:none;}
  .search{display:flex;align-items:center;gap:10px;width:340px;height:42px;padding:0 16px;
    background:var(--color-surface-soft);border:1px solid transparent;border-radius:var(--radius-full);color:var(--color-stone);}
  .search:focus-within{border-color:var(--color-fb-blue);background:var(--color-canvas);}
  .search svg{width:17px;height:17px;stroke:var(--color-steel);}
  .search input{border:0;background:transparent;outline:none;font-family:var(--font-body);font-size:14px;letter-spacing:-.14px;color:var(--color-ink);width:100%;}
  .search input::placeholder{color:var(--color-stone);}
  .topbar .spacer{flex:1;}
  .ib-wrap{position:relative;}
  .ib-wrap .dot{position:absolute;top:-3px;right:-3px;background:var(--color-critical);color:#fff;font-size:10.5px;font-weight:700;
    min-width:18px;height:18px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;border:2px solid var(--color-canvas);padding:0 3px;}
  .prof{display:flex;align-items:center;gap:10px;cursor:pointer;padding-left:4px;}
  .prof .ava{width:36px;height:36px;border-radius:var(--radius-full);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--color-ink);}
  .prof .pn b{font-size:13.5px;font-weight:700;display:block;line-height:1.2;color:var(--color-ink-deep);}
  .prof .pn span{font-size:11.5px;color:var(--color-stone);}

  .content{padding:24px 28px 32px;overflow:auto;flex:1;display:flex;flex-direction:column;}

  /* control bar */
  .ctrl-top{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;}
  .ctrl-top h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;font-feature-settings:"ss01" 1,"ss02" 1;color:var(--color-ink-deep);}
  .ctrl-top .tot{font-size:14px;color:var(--color-steel);font-weight:600;margin-left:2px;letter-spacing:-.14px;}
  .ctrl-top .spacer{flex:1;}
  .ctrl-filters{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
  .fdrop{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:var(--radius-full);
    border:1px solid var(--color-hairline);background:var(--color-canvas);color:var(--color-ink-deep);
    font-size:13px;font-weight:600;letter-spacing:-.14px;cursor:pointer;transition:border-color 150ms,background-color 150ms;}
  .fdrop:hover{border-color:var(--color-stone);}
  .fdrop .ph{color:var(--color-stone);}
  .fdrop svg{width:15px;height:15px;stroke:var(--color-steel);}
  .ctrl-filters .spacer{flex:1;}
  .ctrl-filters .search{height:40px;width:280px;}

  /* board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start;flex:1;}
  .kcol{background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);
    padding:12px;display:flex;flex-direction:column;min-height:560px;transition:background-color 150ms,border-color 150ms,box-shadow 150ms;}
  .kcol.over{background:#e6f0fd;border:1px dashed var(--color-primary);box-shadow:inset 0 0 0 1px var(--color-primary);}
  .kcol-head{display:flex;align-items:center;gap:9px;padding:6px 8px 12px;}
  .kcol-head .stage{width:9px;height:9px;border-radius:50%;flex:none;}
  .kcol-head h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.14px;color:var(--color-ink-deep);}
  .kcol-head .cnt{margin-left:auto;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);
    border-radius:var(--radius-full);font-size:11.5px;font-weight:700;padding:2px 9px;color:var(--color-steel);}
  .kcol-body{display:flex;flex-direction:column;gap:10px;flex:1;}

  /* card */
  .kcard{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-lg);
    padding:13px 14px;cursor:grab;transition:box-shadow 150ms,border-color 150ms,transform 150ms;}
  .kcard:hover{border-color:var(--color-stone);box-shadow:0 2px 8px rgba(10,19,23,.07);}
  .kcard:active{cursor:grabbing;}
  .kcard.dragging{opacity:.4;border-style:dashed;}
  .kc-co{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--color-steel);letter-spacing:-.14px;margin-bottom:7px;}
  .kc-co svg{width:14px;height:14px;stroke:var(--color-stone);}
  .kc-task{font-size:14.5px;font-weight:700;color:var(--color-ink-deep);letter-spacing:-.16px;line-height:1.35;margin-bottom:11px;}
  .kc-foot{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .kc-owner{display:flex;align-items:center;gap:7px;padding-top:11px;border-top:1px solid var(--color-hairline-soft);font-size:12px;color:var(--color-steel);font-weight:600;}
  .kc-owner .ava{width:22px;height:22px;border-radius:var(--radius-full);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--color-ink);}

  .cat{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--radius-full);
    border:1px solid var(--color-hairline);background:var(--color-canvas);font-size:11.5px;font-weight:600;
    letter-spacing:-.14px;color:var(--color-charcoal);white-space:nowrap;}
  .dday{display:inline-flex;align-items:center;justify-content:center;padding:4px 11px;border-radius:var(--radius-full);
    font-size:13px;font-weight:700;letter-spacing:.01em;}
  .dday.red{background:var(--color-critical);color:#fff;}
  .dday.amber{background:var(--color-attention);color:#fff;}
  .dday.gray{background:var(--color-surface-soft);color:var(--color-steel);}
  .dday.wait{background:#e2eefc;color:var(--color-primary-deep);}
  .dday.done{background:#e2f0e6;color:#147a49;}

  /* empty */
  .empty{flex:1;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);
    padding:90px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .empty .eico{width:76px;height:76px;border-radius:var(--radius-xl);background:var(--color-surface-soft);display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
  .empty .eico svg{width:36px;height:36px;stroke:var(--color-stone);}
  .empty h2{margin:0 0 10px;font-size:24px;font-weight:600;letter-spacing:-.01em;font-feature-settings:"ss01" 1,"ss02" 1;color:var(--color-ink-deep);white-space:nowrap;}
  .empty p{margin:0 0 28px;font-size:14.5px;color:var(--color-steel);max-width:400px;line-height:1.5;letter-spacing:-.16px;}

  /* slide panel */
  .backdrop{position:absolute;inset:0;background:rgba(10,19,23,.28);z-index:30;opacity:0;pointer-events:none;transition:opacity 200ms ease-out;}
  .backdrop.show{opacity:1;pointer-events:auto;}
  .slideover{position:absolute;top:0;right:0;bottom:0;width:420px;background:var(--color-canvas);z-index:31;
    box-shadow:var(--shadow-sticky-panel);transform:translateX(100%);transition:transform 240ms ease-out;display:flex;flex-direction:column;}
  .slideover.show{transform:translateX(0);}
  .so-head{display:flex;align-items:flex-start;gap:12px;padding:22px 24px 18px;border-bottom:1px solid var(--color-hairline-soft);}
  .so-head .eyebrow{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--color-steel);margin-bottom:6px;}
  .so-head .eyebrow svg{width:14px;height:14px;stroke:var(--color-stone);}
  .so-head h3{margin:0;font-size:19px;font-weight:700;letter-spacing:-.16px;color:var(--color-ink-deep);}
  .so-head .submeta{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .so-close{margin-left:auto;width:34px;height:34px;border-radius:var(--radius-full);border:1px solid var(--color-hairline-soft);
    background:var(--color-canvas);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--color-steel);flex:none;}
  .so-close:hover{background:var(--color-surface-soft);}
  .so-body{padding:22px 24px;overflow:auto;flex:1;}
  .so-label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--color-stone);margin-bottom:11px;}
  .so-sec{margin-bottom:28px;}
  .stage-opts{display:flex;flex-direction:column;gap:8px;}
  .stage-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--color-hairline-soft);
    border-radius:var(--radius-lg);cursor:pointer;font-size:14px;font-weight:600;color:var(--color-charcoal);letter-spacing:-.14px;transition:all 150ms;}
  .stage-opt:hover{background:var(--color-surface-soft);}
  .stage-opt.on{border:2px solid var(--color-radio-selected);color:var(--color-ink-deep);font-weight:700;padding:11px 13px;}
  .stage-opt .ring{width:18px;height:18px;border-radius:50%;border:2px solid var(--color-hairline);flex:none;display:flex;align-items:center;justify-content:center;}
  .stage-opt.on .ring{border-color:var(--color-radio-selected);}
  .stage-opt.on .ring::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--color-radio-selected);}
  .stage-opt .idx{margin-left:auto;font-size:12px;color:var(--color-stone);font-weight:700;}
  .memo{width:100%;min-height:92px;border:1px solid var(--color-hairline);border-radius:var(--radius-lg);padding:12px 14px;
    font-family:var(--font-body);font-size:14px;color:var(--color-ink);resize:vertical;letter-spacing:-.14px;line-height:1.5;}
  .memo:focus{outline:none;border:2px solid var(--color-fb-blue);}
  .link-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1px solid var(--color-hairline-soft);
    border-radius:var(--radius-lg);margin-bottom:8px;font-size:13.5px;color:var(--color-ink-deep);font-weight:600;letter-spacing:-.14px;}
  .link-item svg{width:16px;height:16px;stroke:var(--color-steel);}
  .link-item .lspace{flex:1;}
  .link-item .sz{font-size:12px;color:var(--color-stone);font-weight:500;}
  .pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-full);
    border:1px solid var(--color-hairline);background:var(--color-canvas);color:var(--color-ink-deep);
    font-size:12.5px;font-weight:700;letter-spacing:-.14px;cursor:pointer;transition:background-color 150ms,border-color 150ms;}
  .pill-btn:hover{background:var(--color-surface-soft);border-color:var(--color-stone);}
  .pill-btn svg{width:14px;height:14px;}
  .so-foot{padding:16px 24px;border-top:1px solid var(--color-hairline-soft);display:flex;gap:10px;}
</style>
</head>

    { label:'관리포인트 보드', icon:I.kanban, active:true },
    { label:'일괄안내', icon:I.send },
    { label:'알림', icon:I.bell, badge:3 },
    { label:'설정', icon:I.gear },
  ];
  return (
    <nav className="nav">
      <div className="brand"><div className="mark">관</div><div><b>관제</b><small>Compliance Desk</small></div></div>
      <div className="nav-sec">메뉴</div>
      {items.map((it,i) => (
        <div key={i} className={'nav-item' + (it.active ? ' active' : '')}>
          {it.icon}<span>{it.label}</span>{it.badge ? <span className="nbadge">{it.badge}</span> : null}
        </div>
      ))}
      <div className="nav-foot"><div className="ava">김</div><div className="who"><b>김컨설턴트</b><span>Growth Partners</span></div></div>
    </nav>
  );
}

function TopBar() {
  return (
    <header className="topbar">
      <div className="search">{I.search}<input placeholder="기업·자격·과제 검색" /></div>
      <div className="spacer"></div>
      <div className="ib-wrap"><IconButton label="알림">{I.bell}</IconButton><span className="dot">3</span></div>
      <div className="prof"><div className="ava">김</div><div className="pn"><b>김컨설턴트</b><span>경영컨설턴트</span></div></div>
    </header>
  );
}

const Cat = ({ children }) => <span className="cat">{children}</span>;
const STAGES = [
  { k:'diag', name:'현황진단', color:'var(--color-stone)' },
  { k:'prop', name:'제안',     color:'var(--color-attention)' },
  { k:'apply',name:'신청',     color:'var(--color-primary)' },
  { k:'result',name:'결과',    color:'var(--color-success)' },
];

const SEED = [
  { id:1,  co:'한울바이오',       task:'정책자금(운전) 신청검토', cat:'정책자금',       d:'D-12', dCls:'gray', col:'diag' },
  { id:2,  co:'대성화학',         task:'R&D 세액공제 경정청구',   cat:'세액공제',       d:'D-40', dCls:'gray', col:'diag' },
  { id:3,  co:'누리소프트',       task:'벤처확인 신규 진단',      cat:'벤처확인',       d:'D-55', dCls:'gray', col:'diag' },
  { id:4,  co:'그린에너지솔루션', task:'디딤돌 R&D 과제 신청',    cat:'정부지원',       d:'D-18', dCls:'gray', col:'prop' },
  { id:5,  co:'스마트팩토리(주)', task:'이노비즈 인증 갱신',      cat:'정부지원',       d:'D-14', dCls:'gray', col:'prop' },
  { id:6,  co:'블루오션테크',     task:'창업도약패키지 지원',     cat:'정부지원',       d:'D-21', dCls:'gray', col:'prop' },
  { id:7,  co:'(주)테크노바',     task:'벤처기업확인 갱신',       cat:'벤처확인',       d:'D-2',  dCls:'red',  col:'apply' },
  { id:8,  co:'코어로보틱스',     task:'기업부설연구소 설립',     cat:'기업부설연구소', d:'D-3',  dCls:'red',  col:'apply' },
  { id:9,  co:'한빛정밀',         task:'R&D 세액공제 신청',       cat:'세액공제',       d:'D-5',  dCls:'amber',col:'apply' },
  { id:10, co:'메디케어랩',       task:'정책자금 결과 대기',      cat:'정책자금',       d:'결과대기', dCls:'wait', col:'result' },
  { id:11, co:'정인테크',         task:'연구소 인정 완료',        cat:'기업부설연구소', d:'완료',   dCls:'done', col:'result' },
];

function Dd({ d, cls }) { return <span className={'dday num ' + cls}>{d}</span>; }

function Card({ c, dragging, onDragStart, onDragEnd, onClick }) {
  return (
    <div className={'kcard' + (dragging ? ' dragging' : '')} draggable
      onDragStart={onDragStart} onDragEnd={onDragEnd} onClick={onClick}>
      <div className="kc-co">{I.building}{c.co}</div>
      <div className="kc-task">{c.task}</div>
      <div className="kc-foot"><Cat>{c.cat}</Cat><Dd d={c.d} cls={c.dCls} /></div>
      <div className="kc-owner"><span className="ava">김</span>{c.owner || '김컨설턴트'}</div>
    </div>
  );
}

function Board({ cards, dragId, overCol, setOverCol, onCardDragStart, onCardDragEnd, onDrop, onOpen }) {
  return (
    <div className="board">
      {STAGES.map(st => {
        const colCards = cards.filter(c => c.col === st.k);
        return (
          <div key={st.k}
            className={'kcol' + (overCol === st.k ? ' over' : '')}
            onDragOver={(e) => { e.preventDefault(); if (overCol !== st.k) setOverCol(st.k); }}
            onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setOverCol(o => o === st.k ? null : o); }}
            onDrop={(e) => { e.preventDefault(); onDrop(st.k); }}>
            <div className="kcol-head">
              <span className="stage" style={{ background: st.color }}></span>
              <h3>{st.name}</h3>
              <span className="cnt num">{colCards.length}</span>
            </div>
            <div className="kcol-body">
              {colCards.map(c => (
                <Card key={c.id} c={c} dragging={dragId === c.id}
                  onDragStart={(e) => onCardDragStart(e, c.id)}
                  onDragEnd={onCardDragEnd}
                  onClick={() => onOpen(c)} />
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function SlidePanel({ card, onClose }) {
  const stageIdx = card ? STAGES.findIndex(s => s.k === card.col) : 0;
  const [stage, setStage] = useState(stageIdx);
  React.useEffect(() => { if (card) setStage(STAGES.findIndex(s => s.k === card.col)); }, [card]);
  return (
    <>
      <div className={'backdrop' + (card ? ' show' : '')} onClick={onClose}></div>
      <div className={'slideover' + (card ? ' show' : '')}>
        {card && (
          <>
            <div className="so-head">
              <div>
                <div className="eyebrow">{I.building}{card.co}</div>
                <h3>{card.task}</h3>
                <div className="submeta"><Cat>{card.cat}</Cat><Dd d={card.d} cls={card.dCls} /></div>
              </div>
              <button className="so-close" onClick={onClose}>{I.close}</button>
            </div>
            <div className="so-body">
              <div className="so-sec">
                <div className="so-label">단계 변경</div>
                <div className="stage-opts">
                  {STAGES.map((s,i) => (
                    <div key={s.k} className={'stage-opt' + (stage===i ? ' on' : '')} onClick={() => setStage(i)}>
                      <span className="ring"></span>{s.name}<span className="idx">{i+1}/4</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="so-sec">
                <div className="so-label">메모</div>
                <textarea className="memo" defaultValue={'담당 김컨설턴트 · 진행 메모를 입력하세요.'}></textarea>
              </div>
              <div className="so-sec">
                <div className="so-label">산출물 링크</div>
                <div className="link-item">{I.file}<span className="lspace">신청서_초안.pdf</span><span className="sz">0.9MB</span></div>
                <div className="link-item">{I.link}<span className="lspace">제출 포털 링크</span></div>
                <button className="pill-btn" style={{ marginTop:4 }}>{I.plus} 링크 추가</button>
              </div>
            </div>
            <div className="so-foot">
              <Button variant="buy" fullWidth>변경 저장</Button>
              <Button variant="secondary" onClick={onClose} style={{ padding:'12px 22px' }}>닫기</Button>
            </div>
          </>
        )}
      </div>
    </>
  );
}

function Filters() {
  return (
    <div className="ctrl-filters">
      <button className="fdrop"><span className="ph">기업</span>{I.chevron}</button>
      <button className="fdrop"><span className="ph">분류</span>{I.chevron}</button>
      <button className="fdrop"><span className="ph">마감기간</span>{I.chevron}</button>
      <div className="spacer"></div>
      <div className="search">{I.search}<input placeholder="과제 검색" /></div>
    </div>
  );
}

function DemoBar({ state, setState }) {
  return (
    <div className="demo-bar">
      <span className="lab">탐색</span>
      <div className="demo-group">
        <span>보드 상태</span>
        <div className="demo-pills">
          <PillTab active={state==='normal'} onClick={() => setState('normal')}>정상</PillTab>
          <PillTab active={state==='empty'} onClick={() => setState('empty')}>빈 상태</PillTab>
        </div>
      </div>
      <span className="hint">카드를 드래그해 단계 이동 · Meta Design System</span>
    </div>
  );
}

function App() {
  const [state, setState] = useState('normal');
  const [cards, setCards] = useState(SEED);
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const [openCard, setOpenCard] = useState(null);

  const onCardDragStart = (e, id) => { setDragId(id); e.dataTransfer.effectAllowed = 'move'; };
  const onCardDragEnd = () => { setDragId(null); setOverCol(null); };
  const onDrop = (col) => {
    if (dragId != null) setCards(cs => cs.map(c => c.id === dragId ? { ...c, col } : c));
    setDragId(null); setOverCol(null);
  };

  const list = state === 'empty' ? [] : cards;
  return (
    <>
      <DemoBar state={state} setState={setState} />
      <div className="app">
        <Nav />
        <div className="main-col">
          <TopBar />
          <div className="content">
            <div className="ctrl-top">
              <h1>관리포인트 보드</h1>
              <span className="tot num">전체 {list.length}건</span>
              <div className="spacer"></div>
              <Button variant="primary">{I.plus} 과제 추가</Button>
            </div>
            <Filters />
            {state === 'empty' ? (
              <div className="empty">
                <div className="eico">{I.kanban}</div>
                <h2>첫 과제를 추가하세요</h2>
                <p>관리 중인 기업의 과제를 등록하면 단계별 보드에서 진행 상황을 한눈에 관제할 수 있습니다.</p>
                <Button variant="buy">{I.plus} 과제 추가</Button>
              </div>
            ) : (
              <Board cards={cards} dragId={dragId} overCol={overCol} setOverCol={setOverCol}
                onCardDragStart={onCardDragStart} onCardDragEnd={onCardDragEnd} onDrop={onDrop} onOpen={setOpenCard} />
            )}
          </div>
        </div>
        <SlidePanel card={openCard} onClose={() => setOpenCard(null)} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
