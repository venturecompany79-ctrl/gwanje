<!DOCTYPE html>

<title>통합 대시보드 (홈) · Meta DS</title>

<link rel="stylesheet" href="_ds/meta-design-system-d06bccfc-faa7-4ee6-9fec-89516d6f6b24/tokens/colors.css">
<link rel="stylesheet" href="_ds/meta-design-system-d06bccfc-faa7-4ee6-9fec-89516d6f6b24/tokens/typography.css">

<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    background:#e7ebef;
    color:var(--color-ink-deep);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  button{font-family:var(--font-body);}

  /* ---- exploration control bar ---- */
  .demo-bar{
    width:1280px;margin:24px auto 14px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;
    padding:12px 18px;background:var(--color-canvas);border:1px solid var(--color-hairline-soft);
    border-radius:var(--radius-xl);
  }
  .demo-bar .lab{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--color-stone);text-transform:uppercase;}
  .demo-group{display:flex;align-items:center;gap:10px;}
  .demo-group > span{font-size:13px;color:var(--color-charcoal);font-weight:700;}
  .demo-pills{display:flex;gap:8px;}
  .demo-bar .hint{margin-left:auto;font-size:12px;color:var(--color-stone);}

  /* ---- app frame ---- */
  .app{
    width:1280px;margin:0 auto 44px;background:var(--color-canvas);
    border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xxl);overflow:hidden;
    display:grid;grid-template-columns:240px 1fr;min-height:880px;
    box-shadow:0 18px 50px rgba(10,19,23,.10);
  }
  .app svg{width:18px;height:18px;flex:none;stroke:currentColor;}
  .demo-pills button,.vtoggle button{white-space:nowrap;}

  /* ---- left nav (white) ---- */
  .nav{border-right:1px solid var(--color-hairline-soft);padding:22px 16px;display:flex;flex-direction:column;background:var(--color-canvas);}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 24px;}
  .brand .mark{width:34px;height:34px;border-radius:var(--radius-full);flex:none;
    background:radial-gradient(circle at 30% 30%,#0091ff,#0064e0 55%,#0457cb);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;}
  .brand b{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--color-ink-deep);line-height:1.1;}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--color-stone);letter-spacing:.01em;}
  .nav-sec{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--color-stone);text-transform:uppercase;padding:12px 12px 8px;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:3px 0;border-radius:var(--radius-full);
    color:var(--color-charcoal);text-decoration:none;font-size:14px;font-weight:600;letter-spacing:-.14px;cursor:pointer;
    border:1px solid transparent;transition:background-color 150ms ease-out,color 150ms ease-out;}
  .nav-item svg{width:19px;height:19px;flex:none;stroke:currentColor;}
  .nav-item:hover{background:var(--color-surface-soft);}
  .nav-item.active{background:var(--color-ink-deep);color:var(--color-canvas);border-color:var(--color-ink-deep);}
  .nav-item .nbadge{margin-left:auto;background:var(--color-critical);color:#fff;font-size:11px;font-weight:700;
    min-width:19px;height:19px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .nav-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--color-hairline-soft);display:flex;align-items:center;gap:11px;}
  .nav-foot .ava{width:34px;height:34px;border-radius:var(--radius-full);background:var(--color-surface-soft);
    border:1px solid var(--color-hairline-soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--color-ink);flex:none;}
  .nav-foot .who b{font-size:13px;font-weight:700;display:block;color:var(--color-ink-deep);}
  .nav-foot .who span{font-size:11.5px;color:var(--color-stone);}

  /* ---- main col ---- */
  .main-col{display:flex;flex-direction:column;min-width:0;background:var(--color-surface-soft);}
  .topbar{height:64px;background:var(--color-canvas);border-bottom:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;gap:16px;padding:0 28px;flex:none;}
  .search{display:flex;align-items:center;gap:10px;width:360px;height:42px;padding:0 16px;
    background:var(--color-surface-soft);border:1px solid transparent;border-radius:var(--radius-full);color:var(--color-stone);}
  .search:focus-within{border-color:var(--color-fb-blue);background:var(--color-canvas);}
  .search svg{width:17px;height:17px;stroke:var(--color-steel);flex:none;}
  .search input{border:0;background:transparent;outline:none;font-family:var(--font-body);font-size:14px;letter-spacing:-.14px;color:var(--color-ink);width:100%;}
  .search input::placeholder{color:var(--color-stone);}
  .topbar .spacer{flex:1;}
  .topbar .ib-wrap{position:relative;}
  .topbar .ib-wrap .dot{position:absolute;top:-3px;right:-3px;background:var(--color-critical);color:#fff;font-size:10.5px;font-weight:700;
    min-width:18px;height:18px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;border:2px solid var(--color-canvas);padding:0 3px;}
  .prof{display:flex;align-items:center;gap:10px;cursor:pointer;padding-left:4px;}
  .prof .ava{width:36px;height:36px;border-radius:var(--radius-full);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--color-ink);}
  .prof .pn b{font-size:13.5px;font-weight:700;display:block;line-height:1.2;color:var(--color-ink-deep);}
  .prof .pn span{font-size:11.5px;color:var(--color-stone);}

  .content{padding:28px;overflow:auto;flex:1;}
  .page-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:24px;}
  .page-head h1{margin:0;font-weight:600;font-size:28px;line-height:1.21;letter-spacing:-.01em;
    font-feature-settings:"ss01" 1,"ss02" 1;color:var(--color-ink-deep);}
  .page-head .sub{font-size:14px;color:var(--color-steel);margin-top:6px;letter-spacing:-.14px;}
  .page-head .sub b{color:var(--color-critical);font-weight:700;}
  .page-head .spacer{flex:1;}
  .head-actions{display:flex;gap:10px;}

  /* ---- KPI ---- */
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .kpi{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);padding:18px 20px;position:relative;}
  .kpi .ktop{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .kpi .klab{font-size:13px;font-weight:600;color:var(--color-steel);letter-spacing:-.14px;white-space:nowrap;}
  .kpi .kico{width:34px;height:34px;border-radius:var(--radius-full);background:var(--color-surface-soft);
    display:flex;align-items:center;justify-content:center;flex:none;}
  .kpi .kico svg{width:17px;height:17px;stroke:var(--color-steel);}
  .kpi .kval{font-size:42px;font-weight:700;line-height:1;letter-spacing:-.02em;margin-top:14px;color:var(--color-ink-deep);}
  .kpi .kval em{font-size:15px;font-weight:600;font-style:normal;color:var(--color-stone);margin-left:4px;}
  .kpi .ksub{font-size:12px;color:var(--color-stone);margin-top:9px;letter-spacing:-.14px;}
  .kpi.urgent{border-color:#f6d9b0;}
  .kpi.urgent .kico{background:#fdeed6;}
  .kpi.urgent .kico svg{stroke:var(--color-attention);}
  .kpi.urgent .kval{color:#b9760a;}

  /* ---- dash grid ---- */
  .dash-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start;}
  .panel{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);overflow:hidden;}
  .panel-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--color-hairline-soft);}
  .panel-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.16px;color:var(--color-ink-deep);}
  .panel-head .cnt{font-size:13px;color:var(--color-stone);font-weight:600;}
  .panel-head .spacer{flex:1;}
  .vtoggle{display:flex;gap:8px;}
  .vtoggle svg{width:15px;height:15px;}

  /* category chip — neutral, monochrome (Meta color discipline) */
  .cat{display:inline-flex;align-items:center;padding:4px 12px;border-radius:var(--radius-full);
    border:1px solid var(--color-hairline);background:var(--color-canvas);font-size:12px;font-weight:600;
    letter-spacing:-.14px;color:var(--color-charcoal);white-space:nowrap;}

  /* neutral D-day badge (for non-urgent) */
  .dday-neutral{display:inline-flex;align-items:center;justify-content:center;min-width:50px;padding:5px 12px;
    border-radius:var(--radius-full);background:var(--color-surface-soft);color:var(--color-steel);
    font-size:14px;font-weight:700;letter-spacing:.01em;}

  /* ---- table (variant A) ---- */
  table.dlist{width:100%;border-collapse:collapse;}
  table.dlist th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.01em;color:var(--color-stone);
    text-transform:uppercase;padding:13px 22px;border-bottom:1px solid var(--color-hairline-soft);background:var(--color-canvas);}
  table.dlist th.r,table.dlist td.r{text-align:right;}
  table.dlist td{padding:16px 22px;border-bottom:1px solid var(--color-hairline-soft);font-size:14px;vertical-align:middle;letter-spacing:-.14px;}
  table.dlist tbody tr:last-child td{border-bottom:0;}
  table.dlist tbody tr{cursor:pointer;transition:background-color 150ms ease-out;}
  table.dlist tbody tr:hover{background:var(--color-surface-soft);}
  table.dlist .co{font-weight:700;color:var(--color-ink-deep);}
  table.dlist .item{color:var(--color-charcoal);}
  table.dlist .date{color:var(--color-steel);font-size:13px;}

  /* ---- grouped (variant B) ---- */
  .grouped{padding:20px 22px 22px;}
  .hero{display:flex;align-items:center;gap:20px;border:1px solid #f3c4cb;background:linear-gradient(180deg,#fdf1f3,var(--color-canvas));
    border-radius:var(--radius-xl);padding:20px 22px;margin-bottom:22px;}
  .hero .lead{display:inline-flex;align-items:center;gap:8px;margin-bottom:8px;}
  .hero .co{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--color-ink-deep);}
  .hero .it{font-size:14px;color:var(--color-charcoal);margin-top:3px;letter-spacing:-.14px;}
  .hero .meta{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .hero .meta .date{font-size:13px;color:var(--color-steel);}
  .hero .spacer{flex:1;}
  .hero .bigd{text-align:center;}
  .hero .bigd .n{font-size:40px;font-weight:700;color:var(--color-critical);line-height:1;letter-spacing:-.02em;}
  .hero .bigd .l{font-size:12px;color:var(--color-stone);font-weight:600;margin-top:4px;}
  .ggroup + .ggroup{margin-top:22px;}
  .glabel{display:flex;align-items:center;gap:9px;margin-bottom:11px;font-size:13px;font-weight:700;color:var(--color-ink-deep);letter-spacing:-.14px;}
  .glabel .gd{width:9px;height:9px;border-radius:50%;}
  .glabel .gc{color:var(--color-stone);font-weight:600;}
  .grow{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--color-hairline-soft);
    border-radius:var(--radius-lg);margin-bottom:10px;transition:background-color 150ms ease-out;cursor:pointer;}
  .grow:last-child{margin-bottom:0;}
  .grow:hover{background:var(--color-surface-soft);}
  .grow .co{font-weight:700;font-size:14px;min-width:140px;color:var(--color-ink-deep);letter-spacing:-.14px;}
  .grow .it{flex:1;font-size:14px;color:var(--color-charcoal);letter-spacing:-.14px;}
  .grow .date{font-size:13px;color:var(--color-stone);}

  /* ---- stubs ---- */
  .stub{padding:24px 22px 28px;}
  .stub-note{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--color-steel);font-weight:600;
    background:var(--color-surface-soft);border-radius:var(--radius-lg);padding:11px 15px;margin-bottom:18px;letter-spacing:-.14px;}
  .stub-note svg{width:17px;height:17px;stroke:var(--color-steel);flex:none;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-head .m{font-size:18px;font-weight:700;letter-spacing:-.16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;}
  .cal-grid .dow{font-size:12px;font-weight:700;color:var(--color-stone);text-align:center;padding-bottom:4px;}
  .cal-cell{aspect-ratio:1.4;border:1px solid var(--color-hairline-soft);border-radius:var(--radius-md);padding:7px 8px;
    font-size:13px;color:var(--color-charcoal);position:relative;background:var(--color-canvas);}
  .cal-cell.muted{background:var(--color-surface-soft);color:var(--color-stone);}
  .cal-cell.today{border:2px solid var(--color-fb-blue);}
  .cal-cell .ev{position:absolute;left:8px;right:8px;bottom:8px;height:5px;border-radius:var(--radius-full);}
  .kb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .kb-col{background:var(--color-surface-soft);border-radius:var(--radius-lg);padding:12px;}
  .kb-col h4{margin:0 0 12px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between;color:var(--color-charcoal);letter-spacing:-.14px;}
  .kb-col h4 span{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-full);font-size:11px;padding:1px 8px;color:var(--color-stone);}
  .kb-card{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-md);padding:12px;margin-bottom:9px;}
  .kb-card.ghost{opacity:.5;}
  .kb-card .kc{font-size:13px;font-weight:700;color:var(--color-ink-deep);letter-spacing:-.14px;}
  .kb-card .ki{font-size:12px;color:var(--color-stone);margin-top:4px;}
  .kb-card .kf{display:flex;align-items:center;justify-content:space-between;margin-top:11px;}

  /* ---- right widgets ---- */
  .widgets{display:flex;flex-direction:column;gap:20px;}
  .wpanel{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);overflow:hidden;}
  .wh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--color-hairline-soft);}
  .wh h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.16px;color:var(--color-ink-deep);}
  .wh .spacer{flex:1;}
  .wh a{font-size:13px;color:var(--color-primary-deep);font-weight:700;text-decoration:none;letter-spacing:-.14px;}
  .wbody{padding:8px 10px 10px;}
  .ai{display:flex;gap:12px;padding:12px 10px;border-radius:var(--radius-lg);cursor:pointer;transition:background-color 150ms ease-out;}
  .ai:hover{background:var(--color-surface-soft);}
  .ai .aico{width:32px;height:32px;border-radius:var(--radius-full);flex:none;display:flex;align-items:center;justify-content:center;}
  .ai .aico svg{width:16px;height:16px;}
  .ai-red{background:#fbe1e5;}.ai-red svg{stroke:var(--color-critical);}
  .ai-amber{background:#fdeed6;}.ai-amber svg{stroke:#c77e00;}
  .ai-blue{background:#e2eefc;}.ai-blue svg{stroke:var(--color-primary);}
  .ai .ab{flex:1;min-width:0;}
  .ai .at{font-size:14px;font-weight:700;line-height:1.35;letter-spacing:-.14px;color:var(--color-ink-deep);}
  .ai .at b{color:var(--color-critical);}
  .ai .as{font-size:12px;color:var(--color-stone);margin-top:2px;letter-spacing:-.14px;}
  .ai .atime{font-size:11.5px;color:var(--color-stone);white-space:nowrap;}
  .fi{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:var(--radius-lg);cursor:pointer;transition:background-color 150ms ease-out;}
  .fi:hover{background:var(--color-surface-soft);}
  .fi .ft{width:34px;height:34px;border-radius:var(--radius-md);background:var(--color-surface-soft);border:1px solid var(--color-hairline-soft);
    flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--color-steel);}
  .fi .fb{flex:1;min-width:0;}
  .fi .fn{font-size:13.5px;font-weight:700;color:var(--color-ink-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.14px;}
  .fi .fc{font-size:12px;color:var(--color-stone);margin-top:2px;}
  .fi .fwhen{font-size:11.5px;color:var(--color-stone);white-space:nowrap;}

  /* ---- empty state ---- */
  .empty-main{background:var(--color-canvas);border:1px solid var(--color-hairline-soft);border-radius:var(--radius-xl);
    padding:80px 30px;text-align:center;display:flex;flex-direction:column;align-items:center;}
  .empty-main .eico{width:76px;height:76px;border-radius:var(--radius-xl);background:var(--color-surface-soft);
    display:flex;align-items:center;justify-content:center;margin-bottom:24px;}
  .empty-main .eico svg{width:36px;height:36px;stroke:var(--color-stone);}
  .empty-main h2{margin:0 0 10px;font-size:24px;font-weight:600;letter-spacing:-.01em;font-feature-settings:"ss01" 1,"ss02" 1;color:var(--color-ink-deep);}
  .empty-main p{margin:0 0 28px;font-size:15px;color:var(--color-steel);max-width:400px;line-height:1.5;letter-spacing:-.16px;}
  .empty-w{padding:34px 16px;text-align:center;}
  .empty-w svg{width:24px;height:24px;stroke:var(--color-stone);margin-bottom:9px;}
  .empty-w p{margin:0;font-size:13px;color:var(--color-stone);letter-spacing:-.14px;}
</style>
</head>
